<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motion Atlas · BVH 动作实验室</title><link rel="stylesheet" href="style.css">
<body><header><div class="brand">M<span>◒</span>TION ATLAS</div><span>计算机动画 / BVH 动作实验室</span><b class="pill">LOCAL · 本地解析</b></header>
<main><aside><div class="eyebrow">01 / MOTION PLAYER</div><h1>让骨架<br>动起来。</h1><p>从层级到运动，观察每一个关节。</p><label class="button primary">＋ 导入 BVH 文件<input id="file" type="file" accept=".bvh" hidden></label><button id="sample">载入内置动作</button><div class="rule"></div><h3>播放控制</h3><div class="row"><button id="play" class="primary">暂停</button><button id="reset">回到起点</button></div><label>播放速度 <strong id="speedText">1.00×</strong><input id="speed" type="range" min="0.25" max="2" step="0.25" value="1"></label><label class="check"><input id="loop" type="checkbox" checked>循环播放</label><label class="check"><input id="names" type="checkbox">显示关节名称</label><button id="view">重置视角</button><div class="note">拖动画面旋转 · 滚轮缩放<br>空格播放 / 暂停<br>支持本地文件拖放</div><footer>24数媒1 · 黄建文<br>202411581361</footer></aside>
<section><div class="stagehead"><div><span class="eyebrow">SKELETON VIEW</span><h2 id="filename">正在加载…</h2></div><span class="pill" id="status">准备就绪</span></div><canvas id="stage" width="1000" height="580"></canvas><div class="stats"><div><small>JOINTS / 关节</small><b id="joints">—</b></div><div><small>FRAMES / 帧数</small><b id="frames">—</b></div><div><small>RATE / 采样率</small><b id="fps">—</b></div><div><small>DURATION / 时长</small><b id="duration">—</b></div></div><div class="timeline"><span id="clock">0.00 s</span><input id="seek" type="range" min="0" max="1" step="0.001" value="0"><span id="frame">FRAME 0</span></div><p id="message">BVH 文件在本机解析，不上传服务器。</p></section></main><script type="module" src="app.js"></script></body></html>
